# Render Blueprint: one free web service built from the Dockerfile.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: prepwise
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false # entered in the dashboard, never committed
